<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Markdown Viewer</title>

    <!-- Marked (Markdown -> HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- GitHub markdown styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">

    <style>
      :root {
        --sidebar-width: 300px;
        --max-width: 920px;
        --accent: #0366d6;
      }

      html,body { height: 100%; margin: 0; background: #ffffff; color: #24292e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }

      /* Top header (compact) */
      header {
        background: #f6f8fa;
        border-bottom: 1px solid #e1e4e8;
        padding: 8px 16px;
        display:flex;
        gap:12px;
        align-items:center;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      header .title { font-weight:600; color:var(--accent); font-size:0.98rem; }
      header .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
      header a.button { padding:6px 10px; background:#ffffff; border:1px solid #ddd; border-radius:6px; color:#0366d6; text-decoration:none; font-size:0.95rem; }
      header button#toggleSidebar { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer; }

      /* Sidebar */
      #sidebar {
        position: fixed;
        left: 0;
        top: 56px;
        bottom: 0;
        width: var(--sidebar-width);
        overflow: auto;
        border-right: 1px solid #e6e9ec;
        background: #fbfcfd;
        padding: 18px 16px;
        box-sizing: border-box;
        z-index: 30;
      }
      #sidebar h3 { margin: 0 0 8px 0; font-size: 0.95rem; color: #222; }
      #sidebar ul { list-style: none; margin: 0; padding: 0; }
      #sidebar li { margin: 6px 0; }
      #sidebar a { color: #0366d6; text-decoration: none; font-size: 0.95rem; }
      #sidebar a.active { font-weight: 600; color: #0a3d62; }

      /* Content area */
      main { margin-left: calc(var(--sidebar-width) + 32px); padding: 24px 24px 80px 0; }
      #content { box-sizing: border-box; padding: 0; max-width: var(--max-width); margin: 0 auto; }
      .markdown-body { font-size:16px; line-height:1.7; }

      /* Limit large top-of-page icons/badges */
      .markdown-body > img:first-child,
      .markdown-body > p > img:first-child { max-width:160px; margin:0.4em auto 1rem; display:block; }
      .markdown-body img { max-width:100%; height:auto; }

      /* Make tables scroll on small screens */
      .markdown-body table { display:block; width:100%; overflow:auto; }

      /* Code styling */
      .markdown-body code { font-size:0.95em; }
      pre { border-radius:6px; overflow:auto; }

      /* Error / status */
      .status { font-size:0.95rem; color:#666; margin-left:8px; }
      .error { color:#b31d28; font-weight:600; padding:12px 18px; background:#fff5f5; border:1px solid #f5c2c7; border-radius:6px; max-width:var(--max-width); margin:20px auto; }

      /* Small screens: hide sidebar by default, allow toggle */
      @media (max-width: 900px) {
        #sidebar { position: fixed; top: 56px; left: 0; height: calc(100vh - 56px); transform: translateX(-120%); transition: transform .18s ease-in-out; width: 84%; max-width: 320px; }
        #sidebar.open { transform: translateX(0); box-shadow: 0 8px 20px rgba(2,6,23,0.08); }
        main { margin-left: 0; padding: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <button id="toggleSidebar" aria-expanded="false">☰ Menu</button>
      <div class="title">Course Viewer</div>
      <div class="controls">
        <a id="openRaw" class="button" target="_blank" rel="noopener">Open raw</a>
        <a id="openRepo" class="button" target="_blank" rel="noopener">Open on GitHub</a>
        <div id="status" class="status">Loading…</div>
      </div>
    </header>

    <nav id="sidebar" aria-label="Course navigation">
      <h3>Course</h3>
      <ul id="navList">
        <!-- Filled by script -->
      </ul>
    </nav>

    <main>
      <div id="content">
        <article id="md" class="markdown-body">Loading...</article>
      </div>
    </main>

    <script>
      // Helpers
      function elt(tag, attrs = {}, txt = '') { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt) e.textContent = txt; return e; }
      function joinPath(base, rel) {
        if (!rel) return base;
        if (rel.startsWith('/')) return rel.slice(1);
        const s = base.split('/');
        s.pop();
        const parts = rel.split('/');
        for (const p of parts) {
          if (p === '.' || p === '') continue;
          if (p === '..') s.pop();
          else s.push(p);
        }
        return s.join('/');
      }
      function isAbsoluteUrl(u) { return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) || u.startsWith('//'); }

      // Fixed course structure (top-level README + 5 units)
      // If you move or rename files, update these paths.
      const repoOwner = 'coastwatch-training';
      const repoNameOnly = 'CoastWatch-Utilities'; // used for stripping top title
      const courseRepo = `${repoOwner}/${repoNameOnly}`;
      const branchDefault = 'main';
      const sidebarPages = [
        { title: 'Home (README)', file: 'README.md' },
        { title: 'Unit 1 — Introduction to the CoastWatch Utilities', file: 'Unit-1-Introduction-to-the-CoastWatch-Utilities/README.md' },
        { title: 'Unit 2 — Basics of the CoastWatch Data Analysis Tool', file: 'Unit-2-Basics-of-the-CoastWatch-Data-Analysis-Tool/README.md' },
        { title: 'Unit 3 — Command-Line Tools for Extracting File Information', file: 'Unit-3-Command-Line-Tools-for-Extracting-File-Information/README.md' },
        { title: 'Unit 4 — More in Depth with the CoastWatch Data Analysis Tool', file: 'Unit-4-More-in-Depth-with-the-CoastWatch-Data-Analysis-Tool/README.md' },
        { title: 'Unit 5 — Command-Line Tools for Data Manipulation', file: 'Unit-5-Command-Line-Tools-for-Data-Manipulation/README.md' }
      ];

      // Read query params
      const params = new URLSearchParams(location.search);
      const rawParam = params.get('url');
      const repoParam = params.get('repo');
      const fileParam = params.get('file');
      const branchParam = params.get('branch') || branchDefault;

      // Determine which file to load
      const defaultRepo = courseRepo;
      const defaultFile = 'README.md';
      const defaultBranch = branchDefault;

      let rawUrl, githubUrl, baseRawDir, currentRepo, currentFile, currentBranch;

      if (rawParam) {
        rawUrl = rawParam;
        githubUrl = null;
        baseRawDir = rawUrl.replace(/\/[^/]+$/, '/');
        currentRepo = null;
        currentFile = rawUrl.split('/').pop();
        currentBranch = null;
      } else if (repoParam && fileParam) {
        currentRepo = repoParam;
        currentFile = fileParam;
        currentBranch = branchParam;
        rawUrl = `https://raw.githubusercontent.com/${repoParam}/${branchParam}/${fileParam}`;
        githubUrl = `https://github.com/${repoParam}/blob/${branchParam}/${fileParam}`;
        baseRawDir = rawUrl.replace(/\/[^/]+$/, '/') + '';
      } else {
        currentRepo = defaultRepo;
        currentFile = defaultFile;
        currentBranch = defaultBranch;
        rawUrl = `https://raw.githubusercontent.com/${defaultRepo}/${defaultBranch}/${defaultFile}`;
        githubUrl = `https://github.com/${defaultRepo}/blob/${defaultBranch}/${defaultFile}`;
        baseRawDir = rawUrl.replace(/\/[^/]+$/, '/');
      }

      const openRawBtn = document.getElementById('openRaw');
      const openRepoBtn = document.getElementById('openRepo');
      const statusEl = document.getElementById('status');
      const mdEl = document.getElementById('md');
      const navList = document.getElementById('navList');
      const sidebar = document.getElementById('sidebar');
      const toggleSidebarBtn = document.getElementById('toggleSidebar');

      openRawBtn.href = rawUrl;
      openRepoBtn.href = githubUrl || `https://github.com/${defaultRepo}`;

      // Build sidebar links
      function buildSidebar(repoToUse = defaultRepo, branchToUse = defaultBranch) {
        navList.innerHTML = '';
        sidebarPages.forEach(p => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `${location.pathname}?repo=${encodeURIComponent(repoToUse)}&file=${encodeURIComponent(p.file)}&branch=${encodeURIComponent(branchToUse)}`;
          a.textContent = p.title;
          // mark active if matches currentFile
          if (currentRepo === repoToUse && currentFile === p.file) a.classList.add('active');
          // For first render, also mark active if no repoParam/fileParam and this is README
          if (!repoParam && !fileParam && p.file === 'README.md') a.classList.add('active');
          li.appendChild(a);
          navList.appendChild(li);
        });
      }
      buildSidebar(currentRepo || defaultRepo, currentBranch || defaultBranch);

      // Sidebar toggle for small screens
      toggleSidebarBtn.addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        toggleSidebarBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      async function fetchAndRender(url) {
        try {
          statusEl.textContent = 'Fetching…';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const md = await res.text();

          statusEl.textContent = 'Rendering…';
          const html = marked.parse(md, { gfm: true, breaks: true });
          mdEl.innerHTML = html;

          // Remove top README title if it matches repository name (often README contains a H1 with repo name)
          const firstH1 = mdEl.querySelector(':scope > h1');
          if (firstH1) {
            const txt = firstH1.textContent.trim();
            // Do removal when it looks like a repo title (contains repo name) or equals it
            if ((currentRepo && txt.includes((currentRepo.split('/').pop()))) || txt === repoNameOnly) {
              firstH1.remove();
            }
          }

          // After rendering, rewrite relative links and image URLs:
          const repoMode = !!(currentRepo && currentFile);
          const base = repoMode ? (`https://raw.githubusercontent.com/${currentRepo}/${currentBranch || branchDefault}/` + (currentFile.includes('/') ? currentFile.replace(/\/[^/]*$/, '/') : '')) : baseRawDir;

          // Rewrite links: .md files open in this viewer; non-md become raw links
          document.querySelectorAll('#md a').forEach(a => {
            const href = a.getAttribute('href') || '';
            if (href.startsWith('#')) return; // fragment only
            if (isAbsoluteUrl(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
            if (href.toLowerCase().endsWith('.md')) {
              if (repoMode) {
                const newPath = joinPath(currentFile, href);
                a.href = `${location.pathname}?repo=${encodeURIComponent(currentRepo)}&file=${encodeURIComponent(newPath)}&branch=${encodeURIComponent(currentBranch || branchDefault)}`;
              } else {
                const newRaw = joinPath(base, href);
                a.href = `${location.pathname}?url=${encodeURIComponent(newRaw)}`;
              }
            } else {
              // other relative assets
              const newRaw = joinPath(base, href);
              a.href = newRaw;
              a.target = '_blank';
              a.rel = 'noopener';
            }
          });

          // Rewrite images
          document.querySelectorAll('#md img').forEach(img => {
            const src = img.getAttribute('src') || '';
            if (isAbsoluteUrl(src)) return;
            const newSrc = joinPath(base, src);
            img.src = newSrc;
          });

          // External links should open in new tab
          document.querySelectorAll('#md a[href]').forEach(a => {
            const href = a.getAttribute('href');
            if (isAbsoluteUrl(href)) { a.target = '_blank'; a.rel = 'noopener'; }
          });

          // Highlight code blocks
          document.querySelectorAll('pre code').forEach(block => {
            try { hljs.highlightElement(block); } catch (e) {}
          });

          statusEl.textContent = '';
        } catch (err) {
          mdEl.innerHTML = `<div class="error">Error loading markdown: ${err.message}</div>`;
          statusEl.textContent = 'Error';
          openRawBtn.href = rawUrl;
        }
      }

      // Start
      fetchAndRender(rawUrl);

      // Close sidebar when navigating (for small screens)
      window.addEventListener('click', e => {
        if (!e.target.closest('#sidebar') && !e.target.closest('#toggleSidebar') && window.innerWidth <= 900) {
          sidebar.classList.remove('open');
          toggleSidebarBtn.setAttribute('aria-expanded', 'false');
        }
      });

    </script>
  </body>
</html>

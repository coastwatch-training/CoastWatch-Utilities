<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CoastWatch Training Documentation</title>

    <!-- GitHub Markdown styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">

    <!-- highlight.js theme (light) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">

    <style>
      :root {
        --content-max-width: 980px;
        --accent: #0a3d62;
        --muted: #6a737d;
      }

      html, body { height: 100%; margin: 0; background: #fbfcfd; color: #24292e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; }
      .site-header { background: var(--accent); color: white; padding: 12px 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
      .site-header .title { font-size: 1.05rem; }
      .site-header a { color: #e6f2f4; text-decoration: none; font-weight: 600; }

      #app { min-height: calc(100vh - 56px); }
      .markdown-body { box-sizing: border-box; padding: 28px; max-width: var(--content-max-width); margin: 24px auto; background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(16,24,40,0.03); }

      /* Typography improvements */
      .markdown-body { font-size: 16px; line-height: 1.72; color: #222; }
      .markdown-body h1 { font-size: 1.9rem; margin-top: 0.25em; margin-bottom: 0.35em; }
      .markdown-body h2 { font-size: 1.5rem; margin-top: 1.1em; margin-bottom: 0.45em; }
      .markdown-body h3 { font-size: 1.2rem; margin-top: 1em; margin-bottom: 0.4em; color: #0b3a58; }
      .markdown-body p { margin: 0.6em 0; color: #333; }

      /* Images and tables */
      .markdown-body img { max-width: 100%; height: auto; display: block; margin: 0.6em 0; border-radius: 6px; }
      .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.9em 0; }
      .markdown-body table th, .markdown-body table td { border: 1px solid #e6eef2; padding: 8px 10px; text-align: left; }
      .markdown-body blockquote { border-left: 4px solid #e1eef6; padding: 8px 12px; color: var(--muted); background: #f7fbfc; border-radius: 4px; }

      /* Code blocks */
      pre { background: #0b1220; border-radius: 6px; padding: 12px; overflow: auto; }
      pre code { display: block; color: #e6eef6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Liberation Mono", monospace; font-size: 0.9rem; }
      code.inline { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 6px; font-size: 0.95em; }

      /* Copy button placement (docsify-copy-code provides .docsify-copy-code) */
      .docsify-copy-code { position: relative; display: inline-block; float: right; margin: -36px 6px 0 0; z-index: 20; }

      /* Responsive */
      @media (max-width: 900px) {
        .markdown-body { margin: 12px; padding: 18px; }
        .site-header { padding: 10px 14px; }
      }
    </style>

    <!-- Docsify configuration must be defined before the docsify script loads -->
    <script>
      window.$docsify = {
        name: 'CoastWatch Training',
        repo: 'coastwatch-training/CoastWatch-Utilities',
        loadSidebar: true,
        subMaxLevel: 2,
        search: 'auto',
        coverpage: true,
        homepage: 'README.md',
        auto2top: true,
        // small plugin to re-run highlight.js after docsify renders content
        plugins: [
          function(hook, vm) {
            hook.doneEach(function() {
              // highlight.js will style code blocks after each render
              document.querySelectorAll('pre code').forEach(function(block) {
                try { hljs.highlightElement(block); } catch (e) {}
              });
            });
          }
        ]
      };
    </script>

    <!-- docsify core -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js" defer></script>

    <!-- docsify plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js" defer></script>

    <!-- highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js" defer></script>
  </head>

  <body>
    <div class="site-header">
      <div class="title">CoastWatch Training Documentation</div>
      <div style="margin-left:auto;">
        <a href="https://github.com/coastwatch-training/CoastWatch-Utilities" target="_blank" rel="noopener">Repository</a>
      </div>
    </div>

    <!-- docsify mounts here and will render README.md by default -->
    <div id="app" class="markdown-body"></div>
  </body>
</html>

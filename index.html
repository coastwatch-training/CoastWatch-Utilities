<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CoastWatch Training Documentation</title>

    <!-- GitHub Markdown styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">

    <style>
      html,body { height: 100%; margin: 0; }
      #app { height: 100%; }
      .markdown-body { box-sizing: border-box; padding: 28px; max-width: 980px; margin: 0 auto; }
      .site-header { background: #0a3d62; color: white; padding: 12px 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
      .site-header a { color: #a8dadc; text-decoration: none; font-weight: 600; }
      @media (max-width: 600px) { .markdown-body { padding: 16px; } }
    </style>

    <!-- Docsify configuration must be defined before the docsify script loads -->
    <script>
      window.$docsify = {
        name: 'CoastWatch Training',
        repo: 'coastwatch-training/CoastWatch-Utilities',
        loadSidebar: true,
        subMaxLevel: 2,
        search: 'auto',
        coverpage: true,
        homepage: 'README.md'
      };
    </script>

    <!-- docsify core (stable) -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js" defer></script>
    <!-- docsify search plugin -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js" defer></script>
  </head>

  <body>
    <div class="site-header">CoastWatch Training Documentation</div>

    <!-- docsify mounts here and will render README.md by default -->
    <div id="app" class="markdown-body"></div>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CoastWatch Training Documentation</title>

    <!-- GitHub Markdown styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">

    <!-- highlight.js theme (light) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">

    <style>
      :root {
        --content-max-width: 980px;
        --accent: #0a3d62;
        --muted: #6a737d;
      }

      html, body {
        height: 100%;
        margin: 0;
        background: #ffffff; /* keep it GitHub-like */
        color: #24292e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      }

      .site-header {
        background: var(--accent);
        color: white;
        padding: 12px 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .site-header .title { font-size: 1.05rem; }
      .site-header a { color: #e6f2f4; text-decoration: none; font-weight: 600; }

      #app { min-height: calc(100vh - 56px); }

      /* Use GitHub's markdown container but make it flush (no white card shadow)
         so the site more closely resembles GitHub's native file view */
      .markdown-body {
        box-sizing: border-box;
        padding: 48px 32px;
        max-width: var(--content-max-width);
        margin: 24px auto;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      /* Typography tweaks (keeps GitHub feel) */
      .markdown-body { font-size: 16px; line-height: 1.7; color: #24292e; }
      .markdown-body h1 { font-size: 1.8rem; margin-top: 0.2em; margin-bottom: 0.3em; }
      .markdown-body h2 { font-size: 1.4rem; margin-top: 0.9em; margin-bottom: 0.4em; }
      .markdown-body h3 { font-size: 1.15rem; margin-top: 0.9em; margin-bottom: 0.35em; color: #0b3a58; }
      .markdown-body p { margin: 0.6em 0; }

      /* Images:
         - keep all images responsive by default
         - but limit any image that appears as the first element of the page (often badges or icons)
         so small badges/icons don't blow up into large banners */
      .markdown-body img { max-width: 100%; height: auto; display: block; }
      .markdown-body > img:first-child,
      .markdown-body > p > img:first-child {
        /* small, centered icon for top-of-page images (like GitHub does) */
        max-width: 160px;
        width: auto;
        margin: 0.4em auto 1rem;
      }

      /* Badge-style inline images (e.g., shields) — keep them small inline */
      .markdown-body img[alt*="badge"], 
      .markdown-body img[src*="shields.io"] {
        max-height: 1.2em;
        vertical-align: middle;
      }

      /* Tables and blockquote styling similar to GitHub */
      .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.9em 0; }
      .markdown-body table th, .markdown-body table td { border: 1px solid #e6eef2; padding: 8px 10px; text-align: left; }
      .markdown-body blockquote { border-left: 4px solid #e1eef6; padding: 8px 12px; color: var(--muted); background: #f7fbfc; border-radius: 4px; }

      /* Code blocks */
      pre { background: #0b1220; border-radius: 6px; padding: 12px; overflow: auto; }
      pre code { display: block; color: #e6eef6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Liberation Mono", monospace; font-size: 0.9rem; }
      code.inline { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 6px; font-size: 0.95em; }

      /* Copy button placement (docsify-copy-code) */
      .docsify-copy-code { position: relative; display: inline-block; float: right; margin: -36px 6px 0 0; z-index: 20; }

      @media (max-width: 900px) {
        .markdown-body { margin: 12px; padding: 20px; }
        .site-header { padding: 10px 14px; }
      }
    </style>

    <!-- Docsify configuration should be set before the scripts load -->
    <script>
      window.$docsify = {
        name: 'CoastWatch Training',
        repo: 'coastwatch-training/CoastWatch-Utilities',
        loadSidebar: true,
        subMaxLevel: 2,
        search: 'auto',
        coverpage: false,   // disable large coverpage banners by default
        homepage: 'README.md',
        auto2top: true,
        plugins: [
          function(hook, vm) {
            hook.doneEach(function() {
              // highlight.js will style code blocks after each render
              document.querySelectorAll('pre code').forEach(function(block) {
                try { hljs.highlightElement(block); } catch (e) {}
              });
            });
          }
        ]
      };
    </script>

    <!-- docsify + plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js" defer></script>

    <!-- highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js" defer></script>
  </head>

  <body>
    <div class="site-header">
      <div class="title">CoastWatch Training Documentation</div>
      <div style="margin-left:auto;">
        <a href="https://github.com/coastwatch-training/CoastWatch-Utilities" target="_blank" rel="noopener">Repository</a>
      </div>
    </div>

    <!-- docsify mounts here and will render README.md by default -->
    <div id="app" class="markdown-body"></div>
  </body>
</html>
